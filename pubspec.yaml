name: penta_core
description: >-
  Core toolkit for Flutter apps: namespaced extensions, spacing tokens,
  result models, use case contracts, JSON localization, toast, showcase,
  responsive layout and an international phone field.
version: 3.0.0
homepage: https://github.com/ANILSRGT/flutter_penta_core
repository: https://github.com/ANILSRGT/flutter_penta_core
issue_tracker: https://github.com/ANILSRGT/flutter_penta_core/issues
license: MIT
topics:
  - utilities
  - extensions
  - localization
  - widgets
  - toast

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  ansicolor: ^2.0.3
  internet_connection_checker: ^3.0.1
  intl: ^0.20.2
  meta: ^1.16.0

dev_dependencies:
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

executables:
  lang_generator: lang_generator
